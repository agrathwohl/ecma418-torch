[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecma418-torch"
version = "0.1.0"
description = "Differentiable ECMA-418-2 (2025) roughness and fluctuation strength in PyTorch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Andrew Grathwohl", email = "andrew@grathwohl.me" },
]
keywords = ["audio", "psychoacoustics", "roughness", "fluctuation-strength", "ecma-418-2", "differentiable", "pytorch"]
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "numpy",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecma418_torch"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
